services:
  - type: web
    name: arena10-backend
    runtime: node
    rootDir: arena10-backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://www.arena10.games
      - key: INTERNAL_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: RAPID_API_KEY
        sync: false
      - key: RAPID_API_HOST
        value: api-football-v1.p.rapidapi.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
